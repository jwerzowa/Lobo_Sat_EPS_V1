<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="Arial, sans-serif"><rect width="940" height="680" fill="#fff"/><text x="470" y="34" font-size="15" text-anchor="middle" fill="#222" font-weight="600">Battery protection topology (2S2P) — block level, pin numbers come from the datasheets</text><line x1="120" y1="80" x2="300" y2="80" stroke="#A32D2D" stroke-width="2"/><text x="130" y="72" font-size="12" text-anchor="start" fill="#A32D2D" font-weight="600">BAT_P</text><rect x="300" y="58" width="110" height="44" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="355.0" y="85.0" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Fuse 0466</text><line x1="410" y1="80" x2="440" y2="80" stroke="#A32D2D" stroke-width="2"/><rect x="440" y="58" width="130" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="505.0" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">ACS37612</text><text x="505.0" y="93.0" text-anchor="middle" font-size="12" fill="#5F5E5A">current sensor</text><line x1="570" y1="80" x2="600" y2="80" stroke="#A32D2D" stroke-width="2"/><rect x="600" y="58" width="110" height="44" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="655.0" y="85.0" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">PTC 0ZCJ</text><line x1="710" y1="80" x2="900" y2="80" stroke="#A32D2D" stroke-width="3"/><text x="720" y="72" font-size="12" text-anchor="start" fill="#A32D2D" font-weight="600">VBUS (P+)</text><text x="720" y="98" font-size="11" text-anchor="start" fill="#555">to charger, inhibit, heater</text><line x1="120" y1="80" x2="120" y2="110" stroke="#A32D2D" stroke-width="2"/><circle cx="120" cy="80" r="4" fill="#444"/><rect x="50" y="110" width="140" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="120.0" y="135.0" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Cells 2A ‖ 2B</text><text x="120.0" y="153.0" text-anchor="middle" font-size="12" fill="#0F6E56">top pair, 3.0–4.2 V</text><line x1="120" y1="170" x2="120" y2="200" stroke="#854F0B" stroke-width="2"/><line x1="120" y1="200" x2="380" y2="200" stroke="#854F0B" stroke-width="2"/><circle cx="120" cy="200" r="4" fill="#444"/><text x="130" y="192" font-size="12" text-anchor="start" fill="#854F0B" font-weight="600">BAT_MID</text><text x="390" y="205" font-size="11" text-anchor="start" fill="#555">→ to S-8252 VC, BQ29209 cell sense, ADC divider</text><line x1="120" y1="200" x2="120" y2="230" stroke="#854F0B" stroke-width="2"/><rect x="50" y="230" width="140" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="120.0" y="255.0" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Cells 1A ‖ 1B</text><text x="120.0" y="273.0" text-anchor="middle" font-size="12" fill="#0F6E56">bottom pair, 3.0–4.2 V</text><line x1="120" y1="290" x2="120" y2="330" stroke="#185FA5" stroke-width="2"/><line x1="120" y1="330" x2="300" y2="330" stroke="#185FA5" stroke-width="2"/><circle cx="120" cy="330" r="4" fill="#444"/><text x="130" y="322" font-size="12" text-anchor="start" fill="#185FA5" font-weight="600">BAT_N (cell negative)</text><rect x="300" y="300" width="220" height="60" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="410.0" y="325.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">FS8205A cutoff FETs</text><text x="410.0" y="343.0" text-anchor="middle" font-size="12" fill="#534AB7">Q_DIS ← DO · Q_CHG ← CO</text><line x1="520" y1="330" x2="900" y2="330" stroke="#2C2C2A" stroke-width="3"/><text x="530" y="322" font-size="12" text-anchor="start" fill="#2C2C2A" font-weight="600">GND = P− (system ground)</text><text x="530" y="348" font-size="11" text-anchor="start" fill="#555">everything downstream uses this</text><rect x="40" y="400" width="130" height="210" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="105.0" y="510.0" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13"></text><text x="105.0" y="422" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">S-8252AAC</text><text x="105.0" y="438" text-anchor="middle" font-size="11" fill="#993C1D">primary protection</text><text x="162" y="464" text-anchor="end" font-size="12" fill="#712B13">VDD</text><line x1="170" y1="460" x2="194" y2="460" stroke="#444" stroke-width="1.5"/><text x="200" y="464" font-size="12" text-anchor="start" fill="#222">BAT_P (RC filter)</text><text x="162" y="490" text-anchor="end" font-size="12" fill="#712B13">VC</text><line x1="170" y1="486" x2="194" y2="486" stroke="#444" stroke-width="1.5"/><text x="200" y="490" font-size="12" text-anchor="start" fill="#222">BAT_MID (RC filter)</text><text x="162" y="516" text-anchor="end" font-size="12" fill="#712B13">VSS</text><line x1="170" y1="512" x2="194" y2="512" stroke="#444" stroke-width="1.5"/><text x="200" y="516" font-size="12" text-anchor="start" fill="#222">BAT_N</text><text x="162" y="542" text-anchor="end" font-size="12" fill="#712B13">DO</text><line x1="170" y1="538" x2="194" y2="538" stroke="#444" stroke-width="1.5"/><text x="200" y="542" font-size="12" text-anchor="start" fill="#222">Q_DIS gate (FS8205A)</text><text x="162" y="568" text-anchor="end" font-size="12" fill="#712B13">CO</text><line x1="170" y1="564" x2="194" y2="564" stroke="#444" stroke-width="1.5"/><text x="200" y="568" font-size="12" text-anchor="start" fill="#222">Q_CHG gate (FS8205A)</text><text x="162" y="594" text-anchor="end" font-size="12" fill="#712B13">VM</text><line x1="170" y1="590" x2="194" y2="590" stroke="#444" stroke-width="1.5"/><text x="200" y="594" font-size="12" text-anchor="start" fill="#222">GND (P−) via resistor</text><rect x="480" y="400" width="130" height="210" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="545.0" y="510.0" text-anchor="middle" font-size="14" font-weight="600" fill="#633806"></text><text x="545.0" y="422" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">BQ29209</text><text x="545.0" y="438" text-anchor="middle" font-size="11" fill="#854F0B">backup OVP + balance</text><text x="602" y="464" text-anchor="end" font-size="12" fill="#633806">VDD</text><line x1="610" y1="460" x2="634" y2="460" stroke="#444" stroke-width="1.5"/><text x="640" y="464" font-size="12" text-anchor="start" fill="#222">BAT_P (RC filter)</text><text x="602" y="490" text-anchor="end" font-size="12" fill="#633806">VC2 / VC1</text><line x1="610" y1="486" x2="634" y2="486" stroke="#444" stroke-width="1.5"/><text x="640" y="490" font-size="12" text-anchor="start" fill="#222">BAT_P / BAT_MID (RC)</text><text x="602" y="516" text-anchor="end" font-size="12" fill="#633806">GND</text><line x1="610" y1="512" x2="634" y2="512" stroke="#444" stroke-width="1.5"/><text x="640" y="516" font-size="12" text-anchor="start" fill="#222">BAT_N</text><text x="602" y="542" text-anchor="end" font-size="12" fill="#633806">OUT</text><line x1="610" y1="538" x2="634" y2="538" stroke="#444" stroke-width="1.5"/><text x="640" y="542" font-size="12" text-anchor="start" fill="#222">inverter → LT3652 SHDN</text><text x="602" y="568" text-anchor="end" font-size="12" fill="#633806">CB pins</text><line x1="610" y1="564" x2="634" y2="564" stroke="#444" stroke-width="1.5"/><text x="640" y="568" font-size="12" text-anchor="start" fill="#222">balance resistors</text><text x="602" y="594" text-anchor="end" font-size="12" fill="#633806">CD</text><line x1="610" y1="590" x2="634" y2="590" stroke="#444" stroke-width="1.5"/><text x="640" y="594" font-size="12" text-anchor="start" fill="#222">delay capacitor</text><text x="470" y="640" font-size="11" text-anchor="middle" fill="#555">Pin names shown are functional; exact names/numbers per S-8252 and BQ29209 datasheets. Passive values per datasheet typical application.</text><text x="470" y="660" font-size="12" text-anchor="middle" fill="#A32D2D" font-weight="600">Rule: no power:GND symbol on BAT_N pins. BAT_N and GND are separate nets: the FS8205A switches between them.</text></svg>